<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inventory"></ion-back-button>
    </ion-buttons>

    <ion-title class="title">Detalle de inventario</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" aria-label="Más" (click)="openMore()">
        <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- ===== Skeleton ===== -->
  <ng-container *ngIf="loading; else loaded">
    <div class="card product-card">
      <div class="row">
        <div class="thumb big"></div>
        <div class="meta">
          <div class="line"></div>
          <div class="pill"></div>
          <div class="line small"></div>
        </div>
        <div class="dots"></div>
      </div>
    </div>

    <ion-list>
      <ion-item-divider>Cantidad</ion-item-divider>
      <ion-item><ion-label>Disponible</ion-label><ion-badge
          slot="end">—</ion-badge></ion-item>
    </ion-list>
  </ng-container>

  <!-- ===== Content ===== -->
  <ng-template #loaded>
    <ng-container *ngIf="item as it; else errorTpl">
      <!-- Tarjeta resumen -->
      <div class="card product-card">
        <div class="row">
          <div class="thumb big">
            <img *ngIf="heroImage; else noImage" [src]="heroImage"
              alt="Producto" />
            <ng-template #noImage><div class="noimg"></div></ng-template>
          </div>
          <div class="meta">
            <div class="name">{{ it.name }}</div>
            <ion-chip class="chip" *ngIf="it.categoryName">
              <ion-label>{{ it.categoryName }}</ion-label>
            </ion-chip>
            <div class="desc" *ngIf="it.description">{{ it.description }}</div>
          </div>
          <ion-button fill="clear" class="more" (click)="openMore()">
            <ion-icon name="ellipsis-vertical"></ion-icon>
          </ion-button>
        </div>

        <!-- Mini-galería -->
        <div *ngIf="$any(it).images?.length > 1"
          style="margin-top:10px; display:flex; gap:8px; overflow:auto;">
          <button
            *ngFor="let img of $any(it).images; let i = index"
            (click)="selectImage(i)"
            style="border:none; background:transparent; padding:0; cursor:pointer;">
            <img
              [src]="img || ''"
              [alt]="'img '+i"
              [style]="{width:'48px',height:'48px',objectFit:'cover',borderRadius:'8px',opacity:(i===selectedIndex?'1':'0.6'),outline:(i===selectedIndex?'2px solid #111':'none')}" />
          </button>
        </div>
      </div>

      <!-- Ver historial -->
      <ion-item class="btn-outline" lines="full" button (click)="viewHistory()">
        <ion-label>Ver historial de movimientos</ion-label>
      </ion-item>

      <!-- (NUEVO) Alerta de stock mínimo -->
      <ion-list class="prefs">
        <ion-item lines="full">
          <ion-label>Alerta de stock mínimo</ion-label>
          <ion-toggle slot="end" [(ngModel)]="minStockAlert"></ion-toggle>
        </ion-item>

        <ion-item lines="full">
          <ion-label>Stock mínimo</ion-label>
          <ion-input
            class="pill-input"
            slot="end"
            type="number"
            inputmode="numeric"
            [(ngModel)]="minStock"
            [readonly]="!minStockAlert"
            [value]="minStock"></ion-input>
        </ion-item>
      </ion-list>

      <!-- Cantidad -->
      <ion-list class="qty">
        <ion-item-divider>Cantidad</ion-item-divider>
        <!-- Deja comentado si quieres que solo se vea “Existencias” como en la imagen
        <ion-item>
          <ion-label>Disponible</ion-label>
          <ion-badge slot="end" mode="ios">{{ it.stockAvailable }}</ion-badge>
        </ion-item>
        <ion-item>
          <ion-label>Reservado</ion-label>
          <ion-badge slot="end" mode="ios">{{ it.stockReserved }}</ion-badge>
        </ion-item>
        -->
        <ion-item>
          <ion-label>Existencias</ion-label>
          <ion-badge slot="end" mode="ios">{{ it.stockOnHand }}</ion-badge>
        </ion-item>
      </ion-list>
    </ng-container>

    <ng-template #errorTpl>
      <div class="error-state">
        <p>{{ error || 'No se pudo cargar el inventario.' }}</p>
        <ion-button fill="outline" (click)="reload()">Reintentar</ion-button>
      </div>
    </ng-template>
  </ng-template>
</ion-content>
